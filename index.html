<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fonts are self-hosted (bundled by Vite), so no external font origins are
      needed. Allows Vite HMR over ws + Excalidraw's web workers (blob:) and
      inline image data (data:/blob:).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://img.youtube.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com;  worker-src 'self' blob:; connect-src 'self' https: ws://localhost:5173 http://localhost:* http://127.0.0.1:*"
    />
    <script>
      // Apply the saved theme before first paint so there is never a flash.
      // (Mirrors applyPrefs in src/store/prefs.ts; the app takes over once loaded.)
      (function () {
        var root = document.documentElement;
        var p = {};
        try {
          p = JSON.parse(localStorage.getItem("cadanraw-prefs") || "{}").state || {};
        } catch (e) {}
        var theme = p.theme || "slate";
        root.dataset.theme = theme;
        root.dataset.scheme = theme === "paper" || theme === "glacier" ? "light" : "dark";
        root.dataset.gridStrength = p.gridStrength || "normal";
        root.dataset.motion = p.motion || "system";
      })();
      // Excalidraw loads its drawing fonts at runtime from this base + "fonts/…".
      // We self-host them under public/fonts. A FULL URL to the document directory
      // works in both dev (http://localhost:5173/) and the packaged app
      // (file:///…/dist/) — a bare "/" would resolve to location.origin, which is
      // broken under file://.
      window.EXCALIDRAW_ASSET_PATH = new URL(".", window.location.href).href;
    </script>
    <title>Cadanraw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
