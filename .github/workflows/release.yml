name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify and bundle collaboration service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:renderer
      - run: npm run build:electron
      - name: Bundle standalone relay
        run: tar -czf cadanraw-collaboration.tar.gz dist dist-electron docs/COLLABORATION.md docs/WORKSPACE.md
      - uses: actions/upload-artifact@v4
        with:
          name: cadanraw-collaboration
          path: cadanraw-collaboration.tar.gz
          if-no-files-found: error

  build:
    needs: verify
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            arch: x64
            os: macos-15-intel
            command: npx electron-builder --mac dmg --x64 --publish never
            artifact: cadanraw-macos-x64
            paths: |
              dist-app/*.dmg
          - name: macOS arm64
            arch: arm64
            os: macos-15-intel
            command: npx electron-builder --mac dmg --arm64 --publish never
            artifact: cadanraw-macos-arm64
            paths: |
              dist-app/*arm64.dmg
          - name: Windows
            arch: x64
            os: windows-latest
            command: npx electron-builder --win --x64 --publish never
            artifact: cadanraw-windows
            paths: |
              dist-app/*.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python for native modules
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer
        run: npm run build:renderer

      - name: Build Electron main process
        run: npm run build:electron

      - name: Package ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected a version tag"; exit 1; }

          shopt -s globstar nullglob
          files=()
          for file in release-assets/**; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts found."
            exit 1
          fi

          notes="Unsigned Cadanraw desktop builds for macOS and Windows. macOS may require right-click Open; Windows may show SmartScreen on first launch."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            if [ -f "docs/releases/$tag.md" ]; then
              gh release create "$tag" "${files[@]}" --verify-tag --title "Cadanraw $tag" --notes-file "docs/releases/$tag.md" --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$tag" "${files[@]}" --verify-tag --title "Cadanraw $tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
            fi
          fi
